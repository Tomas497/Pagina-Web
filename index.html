<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portafolio · Tomas Ortiz</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    tailwind.config = {
      darkMode: ['variant', [
        '@media (prefers-color-scheme: dark) { &:not(:is([data-theme="light"] *)) }',
        '&:is([data-theme="dark"] *)'
      ]]
    }
  </script>
</head>
<body class="bg-white text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300 pt-[env(safe-area-inset-top,0px)] pb-[env(safe-area-inset-bottom,0px)]">

<header class="sticky top-[env(safe-area-inset-top,0px)] z-50 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
  <nav class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
    <a href="#inicio" class="text-lg font-bold text-slate-900 dark:text-white">&lt;Tomas Ortiz/&gt;</a>
    <ul class="hidden items-center gap-8 text-sm font-medium md:flex">
    <li><a href="#sobre-mi" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Sobre mí</a></li>
    <li><a href="#habilidades" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Habilidades</a></li>
    <li><a href="#proyectos" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Proyectos</a></li>
    <li><a href="#contacto" class="rounded-full bg-indigo-600 px-4 py-2 text-white transition hover:bg-indigo-500">Contacto</a></li>
    </ul>

  <details class="group relative md:hidden">
    <summary class="cursor-pointer list-none rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-900 dark:border-slate-700 dark:text-white">
      Menú
    </summary>
      <ul class="absolute right-0 mt-2 w-44 rounded-xl border border-slate-200 bg-white p-2 text-sm font-medium shadow-lg dark:border-slate-800 dark:bg-slate-900">
      <li><a href="#sobre-mi" class="block rounded-lg px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800">Sobre mí</a></li>
      <li><a href="#habilidades" class="block rounded-lg px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800">Habilidades</a></li>
      <li><a href="#proyectos" class="block rounded-lg px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800">Proyectos</a></li>
      <li><a href="#contacto" class="block rounded-lg px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800">Contacto</a></li>
      </ul>
  </details>
  </nav>
</header>

<main class="mx-auto max-w-5xl px-6">
  <section id="inicio" class="scroll-mt-24 py-20 sm:py-28">
    <div class="flex flex-col-reverse items-start gap-10 sm:flex-row sm:items-center sm:justify-between">

      <div class="max-w-2xl">
        <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">
          Hola, soy
        </p>

        <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-6xl dark:text-white">
          Tomas,
          <span class="bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent dark:from-indigo-400 dark:to-violet-300">
            developer.
          </span>
        </h1>

        <p class="mt-6 text-lg leading-relaxed">
          Crecimiento: construyo ideas y proyectos apasionantes.
        </p>

        <div class="mt-8 flex flex-wrap gap-4">
          <a href="#proyectos" class="rounded-full bg-indigo-600 px-6 py-3 font-semibold text-white shadow-lg shadow-indigo-600/30 transition hover:-translate-y-0.5 hover:bg-indigo-500">
            Ver proyectos
          </a>

          <a href="#contacto" class="rounded-full border border-slate-300 px-6 py-3 font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:border-indigo-500 dark:border-slate-700 dark:text-white dark:hover:border-indigo-400">
            Hablemos
          </a>
        </div>
      </div>

      <div class="h-32 w-32 shrink-0 overflow-hidden rounded-full border-4 border-indigo-500 shadow-xl shadow-indigo-500/30 sm:h-44 sm:w-44">
        <img
          src="img/selfie.png"
          alt="Foto de Tomas Ortiz"
          class="h-full w-full object-cover object-center">
      </div>
      </div>
  </section>
